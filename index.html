<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Pertemuan 3 JS - Sistem Manajemen Toko Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1e3a8a;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 24px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #0f172a;
    }
    .form-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    button {
      padding: 10px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.btn-danger {
      background-color: #ef4444;
      padding: 6px 12px;
      font-size: 12px;
    }
    button.btn-danger:hover {
      background-color: #dc2626;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .log-box {
      background-color: #1e293b;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 9999px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sistem Manajemen Produk Toko Online</h1>
    <p class="subtitle">Tugas Pertemuan 3 JavaScript - NF Academy</p>

    <!-- Form Tambah Produk -->
    <div class="card">
      <h2>Tambah Produk Baru</h2>
      <div class="form-group">
        <input type="text" id="inputNama" placeholder="Nama Produk (misal: Monitor)" required>
        <input type="number" id="inputHarga" placeholder="Harga (misal: 1500000)" required>
        <input type="number" id="inputStok" placeholder="Jumlah Stok (misal: 5)" required>
      </div>
      <button onclick="handleTambah()">+ Tambah Produk</button>
    </div>

    <!-- Tabel Daftar Produk -->
    <div class="card">
      <h2>Daftar Produk Toko</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Produk</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelBody">
          <!-- Diisi via JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- Log Console Display -->
    <div class="card">
      <h2>Aktivitas Log</h2>
      <div class="log-box" id="logBox">Sistem siap... Log aktivitas akan muncul di sini.</div>
    </div>
  </div>

  <!-- Memuat Script index.js sesuai tugas -->
  <script src="index.js"></script>

  <!-- Script integrasi tampilan HTML -->
  <script>
    function renderTabel() {
      const tbody = document.getElementById("tabelBody");
      tbody.innerHTML = "";

      if (produkToko.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">Tidak ada produk tersedia di toko</td></tr>`;
        return;
      }

      produkToko.forEach(produk => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge">#${produk.id}</span></td>
          <td><strong>${produk.nama}</strong></td>
          <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
          <td>${produk.stok} unit</td>
          <td>
            <button class="btn-danger" onclick="handleHapus(${produk.id})">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function tambahLog(pesan) {
      const logBox = document.getElementById("logBox");
      const timestamp = new Date().toLocaleTimeString("id-ID");
      logBox.textContent += `\n[${timestamp}] ${pesan}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function handleTambah() {
      const nama = document.getElementById("inputNama").value.trim();
      const harga = document.getElementById("inputHarga").value;
      const stok = document.getElementById("inputStok").value;

      if (!nama || !harga || !stok) {
        alert("Harap isi semua kolom: Nama, Harga, dan Stok!");
        return;
      }

      tambahProduk(nama, harga, stok);
      tambahLog(`Menambahkan produk: ${nama}`);
      
      document.getElementById("inputNama").value = "";
      document.getElementById("inputHarga").value = "";
      document.getElementById("inputStok").value = "";

      renderTabel();
    }

    function handleHapus(id) {
      if (confirm(`Yakin ingin menghapus produk dengan ID ${id}?`)) {
        hapusProduk(id);
        tambahLog(`Menghapus produk dengan ID: ${id}`);
        renderTabel();
      }
    }

    // Inisialisasi tampilan tabel pada saat halaman dimuat
    renderTabel();
  </script>
</body>
</html>
